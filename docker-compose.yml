services:
  db:
    image: postgres:16-alpine
    container_name: SkillHubDb
    restart: always
    environment:
      POSTGRES_DB: SkillHubDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - skillhub_postgres_data:/var/lib/postgresql/data
      - ./skillhub_database.sql:/docker-entrypoint-initdb.d/01-init.sql

volumes:
  skillhub_postgres_data:
