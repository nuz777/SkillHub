services:
  db:
    image: postgres:16-alpine
    container_name: skillhub_db
    restart: always
    environment:
      POSTGRES_DB: skillhub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - skillhub_postgres_data:/var/lib/postgresql/data

volumes:
  skillhub_postgres_data:
